# Smart Municipality Application Configuration
server.port=8080

# Profile selection: 'default' uses H2 (MySQL Mode) for zero-friction out-of-the-box demo;
# Change to 'mysql' or run with -Dspring-boot.run.profiles=mysql to use real local MySQL.
# spring.profiles.active=mysql

# Primary Database (H2 file-based with MySQL dialect mode - persists data across restarts)
spring.datasource.url=jdbc:h2:file:./data/municipality_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File Upload Settings
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
file.upload-dir=./uploads

# AI Analysis Configuration
# Provide GEMINI_API_KEY as an env variable or set here.
# If blank, the system automatically uses the intelligent Mock Civic AI Engine.
gemini.api-key=${GEMINI_API_KEY:}
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Civic Hotspot Generation Settings
municipality.hotspot.threshold=3
municipality.similarity.threshold=0.35
